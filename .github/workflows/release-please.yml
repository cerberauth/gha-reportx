name: Release Please

# Releases with release-please, then publishes the package to GitHub Packages.
# Releases created with GITHUB_TOKEN do not trigger other workflows, so
# publishing runs here. Run it manually to publish the version in package.json
# again, e.g. after a failed publish.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to GitHub Packages
    needs: release-please
    # Runs after release-please creates a release, or on manual dispatch (when
    # release-please is skipped).
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Provenance statement
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@cerberauth'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish @cerberauth/gha-reportx to GitHub Packages
        run: npm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
