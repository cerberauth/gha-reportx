name: Release Please

# Releases with release-please, then publishes to npm with trusted publishing
# (OIDC, no token). npm trusts this workflow file only, so publishing lives here
# rather than in a reusable workflow. Run it manually to publish the version in
# package.json again, e.g. after a failed publish.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish npm package
    needs: release-please
    # Runs after release-please creates a release, or on manual dispatch (when
    # release-please is skipped).
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24.22.3 ships npm 11.19, above the 11.5.1 trusted publishing needs.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Authenticates with the GitHub OIDC token (trusted publishing), which
      # also signs the provenance statement.
      - name: Publish @cerberauth/gha-reportx
        run: npm publish --no-git-checks
